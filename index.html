<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Mi Armario ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pink:#FF6FB5;--pink-deep:#E0399A;--pink-soft:#FFE1F1;
  --purple:#B06EFF;--purple-deep:#8A3FE0;--lavender:#F1E3FF;
  --gold:#FFC94D;--gold-deep:#E0A400;
  --blue:#7FD8FF;
  --text:#3D2B4A;--muted:#8C7A99;--card:#FFFFFF;--border:#F5D9EA;
}
body{
  font-family:'Quicksand',Arial,sans-serif;color:var(--text);min-height:100vh;padding-bottom:50px;
  background:
    radial-gradient(circle at 8% 15%,rgba(255,255,255,.9) 0%,transparent 1.2%),
    radial-gradient(circle at 25% 45%,rgba(255,255,255,.8) 0%,transparent 1%),
    radial-gradient(circle at 42% 12%,rgba(255,255,255,.85) 0%,transparent 1.1%),
    radial-gradient(circle at 60% 55%,rgba(255,255,255,.7) 0%,transparent 1%),
    radial-gradient(circle at 78% 22%,rgba(255,255,255,.9) 0%,transparent 1.2%),
    radial-gradient(circle at 90% 60%,rgba(255,255,255,.75) 0%,transparent 1%),
    radial-gradient(circle at 15% 75%,rgba(255,255,255,.8) 0%,transparent 1.1%),
    radial-gradient(circle at 55% 85%,rgba(255,255,255,.7) 0%,transparent 1%),
    radial-gradient(circle at 33% 95%,rgba(255,255,255,.85) 0%,transparent 1.2%),
    radial-gradient(circle at 95% 90%,rgba(255,255,255,.7) 0%,transparent 1%),
    linear-gradient(160deg,#FFE1F1 0%,#F6E3FF 45%,#E4F1FF 100%);
  background-attachment:fixed;background-size:cover;
}
::selection{background:var(--pink);color:#fff;}

header{
  position:sticky;top:0;z-index:100;padding:18px 20px 16px;
  background:linear-gradient(120deg,var(--pink),var(--purple) 55%,var(--pink-deep));
  background-size:220% 220%;animation:shimmerMove 8s ease infinite;
  box-shadow:0 4px 20px rgba(176,110,255,.35);
}
@keyframes shimmerMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.logo-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.logo{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:.3px;
  background:linear-gradient(90deg,#FFF6D5,var(--gold) 40%,#FFF6D5 60%,var(--gold));
  background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:goldShine 4s linear infinite;
}
@keyframes goldShine{to{background-position:250% center;}}
.sparkle{display:inline-block;animation:twinkle 1.8s ease-in-out infinite;}
.sparkle:nth-child(2){animation-delay:.4s;}
.sparkle:nth-child(3){animation-delay:.9s;}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}

.tabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.tabs::-webkit-scrollbar{height:0;}
.tab{position:relative;flex:0 0 auto;text-align:center;padding:10px 14px;border-radius:50px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:0.82rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.tab.active{background:#fff;color:var(--pink-deep);border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15);}
.tab-badge{position:absolute;top:-6px;right:-6px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;font-size:0.65rem;font-weight:800;border-radius:50%;min-width:18px;height:18px;line-height:18px;padding:0 3px;box-shadow:0 2px 6px rgba(0,0,0,.2);}

.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 0;}

/* ── Tiles (categorías del armario) ── */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;}
.cat-tile{
  position:relative;background:var(--card);border:2px solid var(--border);border-radius:20px;padding:22px 12px;
  text-align:center;cursor:pointer;transition:all .2s;overflow:hidden;
  box-shadow:0 3px 0 var(--border),0 8px 20px rgba(224,57,154,.08);
}
.cat-tile::before{content:'';position:absolute;top:-40%;left:-20%;width:60%;height:180%;background:rgba(255,255,255,.55);transform:rotate(20deg);transition:left .5s;}
.cat-tile:hover::before{left:120%;}
.cat-tile:hover{border-color:var(--pink);transform:translateY(-4px);box-shadow:0 3px 0 var(--pink),0 10px 22px rgba(224,57,154,.2);}
.cat-tile-icon{font-size:2.3rem;margin-bottom:8px;display:block;}
.cat-tile-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:0.92rem;color:var(--pink-deep);margin-bottom:3px;}
.cat-tile-total{font-size:0.7rem;color:var(--muted);}
.cat-tile-badge{position:absolute;top:-6px;right:-6px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;font-size:0.7rem;font-weight:800;border-radius:50%;min-width:22px;height:22px;line-height:22px;padding:0 4px;box-shadow:0 2px 6px rgba(0,0,0,.2);}

.detail-head{display:flex;align-items:center;gap:10px;padding:2px 2px 16px;flex-wrap:wrap;}
.back-btn{background:#fff;border:2px solid var(--border);color:var(--pink-deep);border-radius:50px;padding:7px 16px;font-weight:700;font-size:0.8rem;cursor:pointer;}
.back-btn:hover{border-color:var(--pink);}
.detail-icon{font-size:1.6rem;}
.detail-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;color:var(--pink-deep);}
.detail-total{margin-left:auto;font-size:0.75rem;color:var(--muted);}

/* ── Grid de prendas ── */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.item-card{background:var(--card);border:2px solid var(--border);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 3px 0 var(--border);transition:transform .2s;}
.item-card:hover{transform:translateY(-3px);}
.item-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--pink-soft);}
.item-card .item-name{padding:8px 10px 10px;font-size:0.8rem;font-weight:600;text-align:center;}
.item-del{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:0.8rem;color:var(--pink-deep);box-shadow:0 2px 6px rgba(0,0,0,.15);}

.empty-cat{color:var(--muted);font-size:0.85rem;padding:30px 4px;grid-column:1/-1;text-align:center;}

/* ── Referencias (mood board) ── */
.ref-grid{columns:2 220px;column-gap:14px;}
@media(min-width:640px){.ref-grid{columns:3 220px;}}
.ref-card{break-inside:avoid;margin-bottom:14px;background:var(--card);border:2px solid var(--border);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 3px 0 var(--border);}
.ref-card img{width:100%;display:block;}
.ref-nota{padding:8px 10px;font-size:0.78rem;color:var(--muted);}
.ref-del{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:0.8rem;color:var(--pink-deep);box-shadow:0 2px 6px rgba(0,0,0,.15);}

/* ── Outfits ── */
.outfit-gen-box{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:24px 18px;text-align:center;margin-bottom:22px;box-shadow:0 4px 0 var(--border),0 10px 24px rgba(176,110,255,.1);}
.outfit-gen-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;color:var(--purple-deep);margin-bottom:6px;}
.outfit-gen-sub{font-size:0.8rem;color:var(--muted);margin-bottom:16px;}
.btn-magic{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;padding:13px 28px;border-radius:50px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:0.95rem;cursor:pointer;box-shadow:0 6px 16px rgba(176,110,255,.4);transition:transform .15s;}
.btn-magic:hover{transform:scale(1.03);}
.outfit-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:20px;}
.outfit-preview .item-card img{aspect-ratio:1/1;}
.outfit-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.btn-soft{background:var(--lavender);color:var(--purple-deep);border:none;padding:10px 20px;border-radius:50px;font-weight:700;font-size:0.85rem;cursor:pointer;}
.btn-soft:hover{background:#E7D2FF;}

.saved-outfit{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 3px 0 var(--border);}
.saved-outfit-name{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--pink-deep);margin-bottom:10px;font-size:0.95rem;}
.saved-outfit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
.saved-outfit-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--pink-soft);}
.saved-del{background:none;border:none;color:var(--muted);font-size:0.8rem;cursor:pointer;float:right;}
.btn-send{background:var(--gold);color:var(--text);border:none;padding:9px 16px;border-radius:50px;font-weight:700;font-size:0.8rem;cursor:pointer;}
.btn-send:hover{background:var(--gold-deep);color:#fff;}

/* ── Amigas / grupos / revisiones ── */
.section-title{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--purple-deep);font-size:1.02rem;margin:6px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .count{background:var(--lavender);color:var(--purple-deep);font-size:0.68rem;font-weight:800;border-radius:50px;padding:2px 9px;}
.friend-card,.request-card,.group-card,.review-card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 3px 0 var(--border);}
.friend-row{display:flex;align-items:center;gap:10px;}
.friend-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;flex-shrink:0;}
.friend-email{font-weight:700;font-size:0.88rem;word-break:break-all;}
.friend-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0;}
.btn-tiny-ok{background:#3FCF7F;color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:0.95rem;cursor:pointer;}
.btn-tiny-x{background:#FF6B6B;color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:0.95rem;cursor:pointer;}
.btn-tiny-remove{background:none;border:none;color:var(--muted);font-size:0.78rem;cursor:pointer;text-decoration:underline;}
.group-members{font-size:0.75rem;color:var(--muted);margin-top:4px;}
.checklist{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;margin-bottom:10px;}
.checklist label{display:flex;align-items:center;gap:8px;font-size:0.85rem;background:var(--pink-soft);padding:9px 12px;border-radius:12px;cursor:pointer;}
.review-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:0.82rem;color:var(--muted);}
.review-header b{color:var(--text);}
.review-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:12px;}
.review-items img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--pink-soft);}
.reaction-buttons{display:flex;gap:10px;margin-bottom:10px;}
.btn-reaction{flex:1;border:2px solid var(--border);background:#fff;border-radius:14px;padding:11px;font-size:1.3rem;cursor:pointer;transition:all .15s;}
.btn-reaction.aprobado{border-color:#3FCF7F;background:#EAFBF1;}
.btn-reaction.rechazado{border-color:#FF6B6B;background:#FFEDED;}
.comment-input{width:100%;background:var(--pink-soft);border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:0.85rem;font-family:inherit;outline:none;margin-bottom:8px;}
.comment-input:focus{border-color:var(--pink);}
.reactions-list{border-top:1px dashed var(--border);padding-top:10px;margin-top:6px;}
.reaction-item{display:flex;align-items:flex-start;gap:8px;font-size:0.8rem;margin-bottom:8px;}
.reaction-icon{font-size:1rem;flex-shrink:0;}
.reaction-item .re{color:var(--muted);}
.pending-tag{color:var(--muted);font-style:italic;}

/* ── FAB + modal ── */
.fab{position:fixed;bottom:20px;right:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;font-size:1.7rem;cursor:pointer;box-shadow:0 8px 20px rgba(176,110,255,.5);z-index:200;}
.fab:hover{transform:scale(1.06);}

.overlay{position:fixed;inset:0;background:rgba(61,43,74,.55);display:none;align-items:center;justify-content:center;z-index:900;padding:16px;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal h3{font-family:'Fredoka',sans-serif;color:var(--pink-deep);font-size:1.1rem;margin-bottom:14px;}
.modal-close{float:right;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--muted);}
.field{margin-bottom:12px;}
.field label{font-size:0.72rem;font-weight:700;color:var(--purple-deep);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--pink-soft);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:12px;font-size:0.9rem;outline:none;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);}
.preview-img{width:100%;max-height:180px;object-fit:contain;border-radius:14px;margin-bottom:10px;background:var(--pink-soft);display:none;}
.preview-img.show{display:block;}
.modal-send{width:100%;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;padding:13px;border-radius:14px;font-weight:700;font-family:'Fredoka',sans-serif;font-size:0.92rem;cursor:pointer;margin-top:6px;}
.modal-send:hover{opacity:.92;}

/* ── Login / registro ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-box{background:#fff;border-radius:26px;padding:32px 26px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(176,110,255,.25);text-align:center;}
.auth-logo{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.7rem;margin-bottom:4px;
  background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
.auth-sub{font-size:0.82rem;color:var(--muted);margin-bottom:22px;}
.auth-tabs{display:flex;gap:6px;background:var(--pink-soft);border-radius:50px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:50px;font-weight:700;font-size:0.82rem;cursor:pointer;color:var(--muted);}
.auth-tab.active{background:#fff;color:var(--pink-deep);box-shadow:0 2px 8px rgba(224,57,154,.15);}
.auth-field{text-align:left;margin-bottom:14px;}
.auth-field label{font-size:0.72rem;font-weight:700;color:var(--purple-deep);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
.auth-field input{width:100%;background:var(--pink-soft);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:12px;font-size:0.9rem;outline:none;font-family:inherit;}
.auth-field input:focus{border-color:var(--pink);}
.auth-error{color:#D6336C;font-size:0.8rem;margin-bottom:10px;display:none;}
.auth-error.show{display:block;}
.auth-send{width:100%;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;padding:13px;border-radius:14px;font-weight:700;font-family:'Fredoka',sans-serif;font-size:0.95rem;cursor:pointer;margin-top:4px;}
.auth-send:hover{opacity:.92;}
.logout-btn{margin-left:auto;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:50px;padding:6px 14px;font-size:0.75rem;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<!-- PANTALLA DE ACCESO (visible antes de iniciar sesión) -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-box">
    <div class="auth-logo">✨ Mi Armario</div>
    <div class="auth-sub">Tu guardarropa y tus outfits, en un solo lugar</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="authTabLogin" onclick="cambiarAuthTab('login')">Iniciar sesión</div>
      <div class="auth-tab" id="authTabRegister" onclick="cambiarAuthTab('register')">Registrarme</div>
    </div>
    <div class="auth-error" id="authError"></div>
    <div class="auth-field">
      <label>Correo</label>
      <input type="email" id="authEmail" placeholder="tucorreo@ejemplo.com" autocomplete="email"/>
    </div>
    <div class="auth-field">
      <label>Contraseña</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="auth-send" id="authSendBtn" onclick="enviarAuth()">Entrar →</button>
  </div>
</div>

<!-- APP (visible despues de iniciar sesión) -->
<div id="appScreen" style="display:none;">
<header>
  <div class="logo-row">
    <span class="sparkle">✨</span>
    <div class="logo">Mi Armario</div>
    <span class="sparkle">✨</span>
    <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
  </div>
  <div class="tabs">
    <div class="tab active" id="tabArmario" onclick="cambiarSeccion('armario')">👗 Armario</div>
    <div class="tab" id="tabRef" onclick="cambiarSeccion('referencias')">📌 Referencias</div>
    <div class="tab" id="tabOutfits" onclick="cambiarSeccion('outfits')">💫 Outfits</div>
    <div class="tab" id="tabAmigas" onclick="cambiarSeccion('amigas')">👯 Amigas<span class="tab-badge" id="badgeAmigas" style="display:none;">0</span></div>
    <div class="tab" id="tabRevisiones" onclick="cambiarSeccion('revisiones')">💌 Revisiones<span class="tab-badge" id="badgeRevisiones" style="display:none;">0</span></div>
  </div>
</header>

<div class="wrap" id="wrap"></div>

<button class="fab" id="fab" onclick="abrirAgregar()" title="Agregar">+</button>
</div>

<!-- MODAL: agregar prenda -->
<div class="overlay" id="prendaOverlay">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal('prendaOverlay')">✕</button>
    <h3>👗 Nueva prenda</h3>
    <img class="preview-img" id="prendaPreview"/>
    <div class="field">
      <label>Foto</label>
      <input type="file" id="prendaFoto" accept="image/*" onchange="previsualizar(this,'prendaPreview')"/>
    </div>
    <div class="field">
      <label>Nombre</label>
      <input type="text" id="prendaNombre" placeholder="Ej: Blusa floral"/>
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="prendaCategoria"></select>
    </div>
    <button class="modal-send" onclick="guardarPrenda()">✨ Guardar prenda</button>
  </div>
</div>

<!-- MODAL: agregar referencia -->
<div class="overlay" id="refOverlay">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal('refOverlay')">✕</button>
    <h3>📌 Nueva referencia</h3>
    <img class="preview-img" id="refPreview"/>
    <div class="field">
      <label>Imagen (captura de Pinterest, etc.)</label>
      <input type="file" id="refFoto" accept="image/*" onchange="previsualizar(this,'refPreview')"/>
    </div>
    <div class="field">
      <label>Nota (opcional)</label>
      <textarea id="refNota" rows="2" placeholder="Ej: outfit para fiesta, colores pastel..."></textarea>
    </div>
    <button class="modal-send" onclick="guardarReferencia()">📌 Guardar referencia</button>
  </div>
</div>

<!-- MODAL: agregar amiga -->
<div class="overlay" id="amigaOverlay">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal('amigaOverlay')">✕</button>
    <h3>👯 Agregar amiga</h3>
    <div class="field">
      <label>Correo de tu amiga</label>
      <input type="email" id="amigaEmail" placeholder="correo@ejemplo.com"/>
    </div>
    <button class="modal-send" onclick="enviarSolicitudAmistad()">💌 Enviar solicitud</button>
  </div>
</div>

<!-- MODAL: crear grupo -->
<div class="overlay" id="grupoOverlay">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal('grupoOverlay')">✕</button>
    <h3>👯‍♀️ Nuevo grupo</h3>
    <div class="field">
      <label>Nombre del grupo</label>
      <input type="text" id="grupoNombre" placeholder="Ej: Mis chismosas favoritas"/>
    </div>
    <div class="field">
      <label>Elige tus amigas</label>
      <div class="checklist" id="grupoChecklist"></div>
    </div>
    <button class="modal-send" onclick="guardarGrupo()">✨ Crear grupo</button>
  </div>
</div>

<!-- MODAL: enviar outfit a revisión -->
<div class="overlay" id="revisionOverlay">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal('revisionOverlay')">✕</button>
    <h3>📤 Enviar a revisión</h3>
    <div class="field">
      <label>¿A quién se lo mandas?</label>
      <select id="revisionDestino"></select>
    </div>
    <button class="modal-send" onclick="confirmarEnvioRevision()">💌 Mandar para que opinen</button>
  </div>
</div>

<script>
var CATS=[
  {id:'tops',nombre:'Tops',icono:'👚'},
  {id:'bottoms',nombre:'Bottoms',icono:'👖'},
  {id:'vestidos',nombre:'Vestidos',icono:'👗'},
  {id:'abrigos',nombre:'Abrigos',icono:'🧥'},
  {id:'zapatos',nombre:'Zapatos',icono:'👟'},
  {id:'accesorios',nombre:'Accesorios',icono:'👜'}
];
var prendas=[], referencias=[], outfitsGuardados=[];
var amigos=[], solicitudes=[], grupos=[], revisionesParaMi=[], revisionesMias=[], usuariosDirectorio={};
var seccion='armario', categoriaActual=null;
var outfitActual=null;
var archivoSeleccionado=null;
var outfitParaEnviar=null;

function catInfo(id){ return CATS.find(function(c){return c.id===id;}) || {id:id,nombre:id,icono:'✨'}; }
function emailDe(uidPersona){ return (usuariosDirectorio[uidPersona]&&usuariosDirectorio[uidPersona].email)||'alguien'; }
function inicialDe(email){ return (email||'?').charAt(0).toUpperCase(); }

function cambiarSeccion(s){
  seccion=s; categoriaActual=null;
  ['tabArmario','tabRef','tabOutfits','tabAmigas','tabRevisiones'].forEach(function(id){document.getElementById(id).classList.remove('active');});
  document.getElementById({armario:'tabArmario',referencias:'tabRef',outfits:'tabOutfits',amigas:'tabAmigas',revisiones:'tabRevisiones'}[s]).classList.add('active');
  document.getElementById('fab').style.display = (s==='outfits'||s==='revisiones') ? 'none' : 'flex';
  render();
}

function render(){
  if(seccion==='armario'){ categoriaActual ? renderCategoriaArmario() : renderHomeArmario(); }
  else if(seccion==='referencias'){ renderReferencias(); }
  else if(seccion==='outfits'){ renderOutfits(); }
  else if(seccion==='amigas'){ renderAmigas(); }
  else if(seccion==='revisiones'){ renderRevisiones(); }
  actualizarBadges();
}

function actualizarBadges(){
  var bA=document.getElementById('badgeAmigas'), bR=document.getElementById('badgeRevisiones');
  if(solicitudes.length>0){ bA.style.display='flex'; bA.textContent=solicitudes.length; } else bA.style.display='none';
  var sinResponder=revisionesParaMi.filter(function(r){return !r._miReaccion;}).length;
  if(sinResponder>0){ bR.style.display='flex'; bR.textContent=sinResponder; } else bR.style.display='none';
}

function renderHomeArmario(){
  var wrap=document.getElementById('wrap'); wrap.innerHTML='';
  var grid=document.createElement('div'); grid.className='home-grid';
  CATS.forEach(function(c){
    var items=prendas.filter(function(p){return p.categoria===c.id;});
    var tile=document.createElement('div'); tile.className='cat-tile';
    tile.onclick=function(){ categoriaActual=c.id; render(); window.scrollTo(0,0); };
    tile.innerHTML=(items.length>0?'<span class="cat-tile-badge">'+items.length+'</span>':'')+
      '<span class="cat-tile-icon">'+c.icono+'</span><div class="cat-tile-name">'+c.nombre+'</div><div class="cat-tile-total">'+items.length+' prenda'+(items.length===1?'':'s')+'</div>';
    grid.appendChild(tile);
  });
  wrap.appendChild(grid);
}

function renderCategoriaArmario(){
  var info=catInfo(categoriaActual);
  var items=prendas.filter(function(p){return p.categoria===categoriaActual;});
  var wrap=document.getElementById('wrap'); wrap.innerHTML='';
  var head=document.createElement('div'); head.className='detail-head';
  head.innerHTML='<button class="back-btn" onclick="categoriaActual=null;render();">← Armario</button><span class="detail-icon">'+info.icono+'</span><span class="detail-name">'+info.nombre+'</span><span class="detail-total">'+items.length+' prenda'+(items.length===1?'':'s')+'</span>';
  wrap.appendChild(head);
  var grid=document.createElement('div'); grid.className='item-grid';
  if(items.length===0){ grid.innerHTML='<div class="empty-cat">Aún no tienes prendas aquí 🌸<br/>Toca el botón + para agregar una.</div>'; }
  else{
    items.forEach(function(p){
      var card=document.createElement('div'); card.className='item-card';
      card.innerHTML='<button class="item-del" onclick="eliminarPrenda(\''+p._id+'\')">✕</button><img src="'+p.imagenUrl+'"/><div class="item-name">'+escapeHtml(p.nombre)+'</div>';
      grid.appendChild(card);
    });
  }
  wrap.appendChild(grid);
}

function renderReferencias(){
  var wrap=document.getElementById('wrap'); wrap.innerHTML='';
  var head=document.createElement('div'); head.className='detail-head';
  head.innerHTML='<span class="detail-icon">📌</span><span class="detail-name">Referencias</span><span class="detail-total">'+referencias.length+' guardada'+(referencias.length===1?'':'s')+'</span>';
  wrap.appendChild(head);
  if(referencias.length===0){
    wrap.innerHTML+='<div class="empty-cat">Guarda capturas de Pinterest o looks que te inspiren 💖<br/>Toca el botón + para agregar una.</div>';
    return;
  }
  var grid=document.createElement('div'); grid.className='ref-grid';
  referencias.forEach(function(r){
    var card=document.createElement('div'); card.className='ref-card';
    card.innerHTML='<button class="ref-del" onclick="eliminarReferencia(\''+r._id+'\')">✕</button><img src="'+r.imagenUrl+'"/>'+(r.nota?'<div class="ref-nota">'+escapeHtml(r.nota)+'</div>':'');
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
}

function renderOutfits(){
  var wrap=document.getElementById('wrap'); wrap.innerHTML='';
  var box=document.createElement('div'); box.className='outfit-gen-box';
  box.innerHTML=
    '<div class="outfit-gen-title">✨ Generador de outfits</div>'+
    '<div class="outfit-gen-sub">Arma una combinación al azar con tus propias prendas</div>'+
    '<button class="btn-magic" onclick="generarOutfit()">🔮 Generar outfit</button>'+
    '<div id="outfitPreviewWrap"></div>';
  wrap.appendChild(box);
  if(outfitActual) pintarOutfitActual();

  if(outfitsGuardados.length>0){
    var titulo=document.createElement('div'); titulo.className='detail-name'; titulo.style.marginBottom='12px'; titulo.textContent='💫 Mis outfits guardados';
    wrap.appendChild(titulo);
    outfitsGuardados.forEach(function(o){
      var box2=document.createElement('div'); box2.className='saved-outfit';
      var grid='<div class="saved-outfit-grid">'+o.prendas.map(function(p){return '<img src="'+p.imagenUrl+'" title="'+escapeHtml(p.nombre)+'"/>';}).join('')+'</div>';
      box2.innerHTML='<button class="saved-del" onclick="eliminarOutfitGuardado(\''+o._id+'\')">✕</button><div class="saved-outfit-name">'+escapeHtml(o.nombre)+'</div>'+grid+
        '<div style="margin-top:10px;"><button class="btn-send" onclick="abrirEnviarRevisionGuardado(\''+o._id+'\')">📤 Enviar a revisión</button></div>';
      wrap.appendChild(box2);
    });
  }
}

function generarOutfit(){
  var catsConItems=CATS.filter(function(c){return prendas.some(function(p){return p.categoria===c.id;});});
  if(catsConItems.length===0){ alert('Agrega algunas prendas a tu armario primero 🌸'); return; }
  var seleccion=[];
  catsConItems.forEach(function(c){
    var opciones=prendas.filter(function(p){return p.categoria===c.id;});
    seleccion.push(opciones[Math.floor(Math.random()*opciones.length)]);
  });
  outfitActual=seleccion;
  pintarOutfitActual();
}

function pintarOutfitActual(){
  var w=document.getElementById('outfitPreviewWrap');
  if(!w) return;
  w.innerHTML=
    '<div class="outfit-preview">'+outfitActual.map(function(p){return '<div class="item-card"><img src="'+p.imagenUrl+'"/><div class="item-name">'+escapeHtml(p.nombre)+'</div></div>';}).join('')+'</div>'+
    '<div class="outfit-actions">'+
      '<button class="btn-soft" onclick="generarOutfit()">🔀 Otra combinación</button>'+
      '<button class="btn-magic" onclick="guardarOutfitActual()">💾 Guardar outfit</button>'+
      '<button class="btn-send" onclick="abrirEnviarRevisionActual()">📤 Enviar a revisión</button>'+
    '</div>';
}

function guardarOutfitActual(){
  if(!outfitActual) return;
  var nombre=prompt('¿Cómo se llama este outfit?','Look de hoy');
  if(nombre===null) return;
  if(window._guardarOutfit) window._guardarOutfit({nombre:nombre.trim()||'Look sin nombre',prendas:outfitActual.map(function(p){return{id:p._id,nombre:p.nombre,imagenUrl:p.imagenUrl};})});
}

function eliminarOutfitGuardado(id){
  if(!confirm('¿Eliminar este outfit guardado?')) return;
  if(window._eliminarOutfit) window._eliminarOutfit(id);
}

function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// ── Modales ──
function abrirAgregar(){
  if(seccion==='armario') abrirModalPrenda();
  else if(seccion==='referencias') abrirModalReferencia();
  else if(seccion==='amigas') abrirModalAmiga();
}
function cerrarModal(id){ document.getElementById(id).classList.remove('show'); archivoSeleccionado=null; }
function previsualizar(input,imgId){
  archivoSeleccionado=input.files[0];
  var img=document.getElementById(imgId);
  if(archivoSeleccionado){ img.src=URL.createObjectURL(archivoSeleccionado); img.classList.add('show'); }
}
function abrirModalPrenda(){
  var sel=document.getElementById('prendaCategoria'); sel.innerHTML='';
  CATS.forEach(function(c){ var o=document.createElement('option'); o.value=c.id; o.textContent=c.icono+' '+c.nombre; sel.appendChild(o); });
  if(categoriaActual) sel.value=categoriaActual;
  document.getElementById('prendaNombre').value='';
  document.getElementById('prendaFoto').value='';
  document.getElementById('prendaPreview').classList.remove('show');
  archivoSeleccionado=null;
  document.getElementById('prendaOverlay').classList.add('show');
}
function guardarPrenda(){
  var nombre=document.getElementById('prendaNombre').value.trim();
  var categoria=document.getElementById('prendaCategoria').value;
  if(!archivoSeleccionado){ alert('Selecciona una foto'); return; }
  if(!nombre){ alert('Ponle un nombre a la prenda'); return; }
  if(window._subirPrenda) window._subirPrenda(archivoSeleccionado,nombre,categoria);
  cerrarModal('prendaOverlay');
}
function abrirModalReferencia(){
  document.getElementById('refNota').value='';
  document.getElementById('refFoto').value='';
  document.getElementById('refPreview').classList.remove('show');
  archivoSeleccionado=null;
  document.getElementById('refOverlay').classList.add('show');
}
function guardarReferencia(){
  if(!archivoSeleccionado){ alert('Selecciona una imagen'); return; }
  var nota=document.getElementById('refNota').value.trim();
  if(window._subirReferencia) window._subirReferencia(archivoSeleccionado,nota);
  cerrarModal('refOverlay');
}
function eliminarPrenda(id){ if(confirm('¿Eliminar esta prenda?') && window._eliminarPrenda) window._eliminarPrenda(id); }
function eliminarReferencia(id){ if(confirm('¿Eliminar esta referencia?') && window._eliminarReferencia) window._eliminarReferencia(id); }

// ── AMIGAS ──
function renderAmigas(){
  var wrap=document.getElementById('wrap'); wrap.innerHTML='';
  var head=document.createElement('div'); head.className='detail-head';
  head.innerHTML='<span class="detail-icon">👯</span><span class="detail-name">Amigas</span>';
  wrap.appendChild(head);

  if(solicitudes.length>0){
    var t1=document.createElement('div'); t1.className='section-title';
    t1.innerHTML='💌 Solicitudes pendientes <span class="count">'+solicitudes.length+'</span>';
    wrap.appendChild(t1);
    solicitudes.forEach(function(s){
      var email=s.deEmail||'alguien';
      var card=document.createElement('div'); card.className='request-card';
      card.innerHTML='<div class="friend-row"><div class="friend-avatar">'+inicialDe(email)+'</div><div class="friend-email">'+escapeHtml(email)+'</div>'+
        '<div class="friend-actions"><button class="btn-tiny-ok" onclick="responderSolicitud(\''+s._id+'\',true)">✓</button><button class="btn-tiny-x" onclick="responderSolicitud(\''+s._id+'\',false)">✕</button></div></div>';
      wrap.appendChild(card);
    });
  }

  var t2=document.createElement('div'); t2.className='section-title';
  t2.innerHTML='👭 Mis amigas <span class="count">'+amigos.length+'</span>';
  wrap.appendChild(t2);
  if(amigos.length===0){
    wrap.innerHTML+='<div class="empty-cat">Aún no tienes amigas agregadas 🌸<br/>Toca el botón + para invitar a una.</div>';
  } else {
    amigos.forEach(function(a){
      var card=document.createElement('div'); card.className='friend-card';
      card.innerHTML='<div class="friend-row"><div class="friend-avatar">'+inicialDe(a.email)+'</div><div class="friend-email">'+escapeHtml(a.email)+'</div>'+
        '<div class="friend-actions"><button class="btn-tiny-remove" onclick="quitarAmiga(\''+a._id+'\')">Quitar</button></div></div>';
      wrap.appendChild(card);
    });
  }

  var t3=document.createElement('div'); t3.className='section-title'; t3.style.marginTop='18px';
  t3.innerHTML='👯‍♀️ Mis grupos <span class="count">'+grupos.length+'</span>';
  wrap.appendChild(t3);
  var btnGrupo=document.createElement('button'); btnGrupo.className='btn-soft'; btnGrupo.style.marginBottom='12px'; btnGrupo.textContent='+ Crear grupo';
  btnGrupo.onclick=abrirModalGrupo;
  wrap.appendChild(btnGrupo);
  if(grupos.length===0){
    wrap.innerHTML+='<div class="empty-cat" style="padding:14px 4px;">Arma un grupo con tus amigas para mandarles outfits a todas a la vez.</div>';
  } else {
    grupos.forEach(function(g){
      var card=document.createElement('div'); card.className='group-card';
      card.innerHTML='<div class="friend-email">'+escapeHtml(g.nombre)+'</div><div class="group-members">'+g.miembros.length+' integrante'+(g.miembros.length===1?'':'s')+'</div>';
      wrap.appendChild(card);
    });
  }
}

function abrirModalAmiga(){
  document.getElementById('amigaEmail').value='';
  document.getElementById('amigaOverlay').classList.add('show');
}
function enviarSolicitudAmistad(){
  var email=document.getElementById('amigaEmail').value.trim().toLowerCase();
  if(!email){ alert('Escribe un correo'); return; }
  if(window._enviarSolicitud) window._enviarSolicitud(email);
  cerrarModal('amigaOverlay');
}
function responderSolicitud(id,aceptar){ if(window._responderSolicitud) window._responderSolicitud(id,aceptar); }
function quitarAmiga(id){ if(confirm('¿Quitar a esta amiga?') && window._quitarAmiga) window._quitarAmiga(id); }

function abrirModalGrupo(){
  document.getElementById('grupoNombre').value='';
  var cl=document.getElementById('grupoChecklist'); cl.innerHTML='';
  if(amigos.length===0){ cl.innerHTML='<div class="pending-tag">Agrega amigas primero para poder armar un grupo.</div>'; }
  else{
    amigos.forEach(function(a){
      var lbl=document.createElement('label');
      lbl.innerHTML='<input type="checkbox" value="'+a.uid+'"/> '+escapeHtml(a.email);
      cl.appendChild(lbl);
    });
  }
  document.getElementById('grupoOverlay').classList.add('show');
}
function guardarGrupo(){
  var nombre=document.getElementById('grupoNombre').value.trim();
  if(!nombre){ alert('Ponle un nombre al grupo'); return; }
  var checks=document.querySelectorAll('#grupoChecklist input[type=checkbox]:checked');
  if(checks.length===0){ alert('Elige al menos una amiga'); return; }
  var miembros=Array.prototype.map.call(checks,function(c){return c.value;});
  if(window._crearGrupo) window._crearGrupo(nombre,miembros);
  cerrarModal('grupoOverlay');
}

// ── REVISIONES (mandar outfit / reaccionar) ──
function abrirEnviarRevisionActual(){
  if(!outfitActual) return;
  outfitParaEnviar={nombre:'Look de hoy',prendas:outfitActual.map(function(p){return{nombre:p.nombre,imagenUrl:p.imagenUrl};})};
  abrirModalRevision();
}
function abrirEnviarRevisionGuardado(id){
  var o=outfitsGuardados.find(function(x){return x._id===id;});
  if(!o) return;
  outfitParaEnviar={nombre:o.nombre,prendas:o.prendas};
  abrirModalRevision();
}
function abrirModalRevision(){
  if(amigos.length===0&&grupos.length===0){ alert('Agrega amigas o crea un grupo primero, en la pestaña 👯 Amigas'); return; }
  var sel=document.getElementById('revisionDestino'); sel.innerHTML='';
  if(amigos.length>0){
    var og=document.createElement('optgroup'); og.label='Amigas';
    amigos.forEach(function(a){ var o=document.createElement('option'); o.value='amiga:'+a.uid; o.textContent=a.email; og.appendChild(o); });
    sel.appendChild(og);
  }
  if(grupos.length>0){
    var og2=document.createElement('optgroup'); og2.label='Grupos';
    grupos.forEach(function(g){ var o=document.createElement('option'); o.value='grupo:'+g._id; o.textContent=g.nombre; og2.appendChild(o); });
    sel.appendChild(og2);
  }
  document.getElementById('revisionOverlay').classList.add('show');
}
function confirmarEnvioRevision(){
  var val=document.getElementById('revisionDestino').value;
  if(!val||!outfitParaEnviar) return;
  var tipo=val.split(':')[0], id=val.split(':')[1];
  var destinatarios=[], etiqueta='';
  if(tipo==='amiga'){
    var a=amigos.find(function(x){return x.uid===id;});
    destinatarios=[id]; etiqueta=a?a.email:'una amiga';
  } else {
    var g=grupos.find(function(x){return x._id===id;});
    if(g){ destinatarios=g.miembros; etiqueta=g.nombre; }
  }
  if(destinatarios.length===0) return;
  if(window._enviarRevision) window._enviarRevision(outfitParaEnviar.nombre,outfitParaEnviar.prendas,destinatarios,etiqueta);
  outfitParaEnviar=null;
  cerrarModal('revisionOverlay');
  alert('✨ ¡Listo! Ya se lo mandaste para que opinen.');
}

function renderRevisiones(){
  var wrap=document.getElementById('wrap'); wrap.innerHTML='';
  var head=document.createElement('div'); head.className='detail-head';
  head.innerHTML='<span class="detail-icon">💌</span><span class="detail-name">Revisiones</span>';
  wrap.appendChild(head);

  var t1=document.createElement('div'); t1.className='section-title';
  t1.innerHTML='👀 Para que opines <span class="count">'+revisionesParaMi.length+'</span>';
  wrap.appendChild(t1);
  if(revisionesParaMi.length===0){
    wrap.innerHTML+='<div class="empty-cat">Nadie te ha mandado un outfit para opinar todavía.</div>';
  } else {
    revisionesParaMi.forEach(function(r){ wrap.appendChild(renderReviewCardParaMi(r)); });
  }

  var t2=document.createElement('div'); t2.className='section-title'; t2.style.marginTop='18px';
  t2.innerHTML='📤 Mis envíos <span class="count">'+revisionesMias.length+'</span>';
  wrap.appendChild(t2);
  if(revisionesMias.length===0){
    wrap.innerHTML+='<div class="empty-cat">Todavía no has mandado ningún outfit a revisión. Ve a 💫 Outfits y manda uno.</div>';
  } else {
    revisionesMias.forEach(function(r){ wrap.appendChild(renderReviewCardMia(r)); });
  }
}

function renderReviewCardParaMi(r){
  var card=document.createElement('div'); card.className='review-card';
  var header='<div class="review-header">De <b>'+escapeHtml(r.autorEmail||'alguien')+'</b>'+(r.etiqueta?' · '+escapeHtml(r.etiqueta):'')+'</div>';
  var items='<div class="review-items">'+r.prendas.map(function(p){return '<img src="'+p.imagenUrl+'" title="'+escapeHtml(p.nombre)+'"/>';}).join('')+'</div>';
  var ya=r._miReaccion;
  var botones='<div class="reaction-buttons">'+
    '<button class="btn-reaction'+(ya&&ya.tipo==='rechazado'?' rechazado':'')+'" onclick="reaccionar(\''+r._id+'\',\'rechazado\')">❌</button>'+
    '<button class="btn-reaction'+(ya&&ya.tipo==='aprobado'?' aprobado':'')+'" onclick="reaccionar(\''+r._id+'\',\'aprobado\')">✅</button>'+
    '</div>';
  var comentario='<input type="text" class="comment-input" id="comentario_'+r._id+'" placeholder="Deja una sugerencia (opcional)" value="'+(ya&&ya.comentario?escapeHtml(ya.comentario).replace(/"/g,'&quot;'):'')+'" onblur="guardarComentario(\''+r._id+'\')"/>';
  card.innerHTML=header+items+botones+comentario;
  return card;
}

function renderReviewCardMia(r){
  var card=document.createElement('div'); card.className='review-card';
  var header='<div class="review-header">Enviado a <b>'+escapeHtml(r.etiqueta||'')+'</b></div>';
  var items='<div class="review-items">'+r.prendas.map(function(p){return '<img src="'+p.imagenUrl+'" title="'+escapeHtml(p.nombre)+'"/>';}).join('')+'</div>';
  var lista='<div class="reactions-list">'+r.destinatarios.map(function(destUid){
    var re=(r._reacciones||{})[destUid];
    var email=emailDe(destUid);
    if(!re) return '<div class="reaction-item"><span class="reaction-icon">⏳</span><span class="pending-tag">'+escapeHtml(email)+' todavía no ha respondido</span></div>';
    var icono=re.tipo==='aprobado'?'✅':'❌';
    return '<div class="reaction-item"><span class="reaction-icon">'+icono+'</span><div><b>'+escapeHtml(email)+'</b>'+(re.comentario?'<div class="re">"'+escapeHtml(re.comentario)+'"</div>':'')+'</div></div>';
  }).join('')+'</div>';
  card.innerHTML=header+items+lista;
  return card;
}

function reaccionar(revId,tipo){
  var comentarioEl=document.getElementById('comentario_'+revId);
  var comentario=comentarioEl?comentarioEl.value.trim():'';
  if(window._reaccionar) window._reaccionar(revId,tipo,comentario);
}
function guardarComentario(revId){
  var r=revisionesParaMi.find(function(x){return x._id===revId;});
  if(!r||!r._miReaccion) return; // solo re-guarda si ya reacciono, para no perder el tipo
  var comentarioEl=document.getElementById('comentario_'+revId);
  if(window._reaccionar) window._reaccionar(revId,r._miReaccion.tipo,comentarioEl.value.trim());
}

// ── Acceso (login / registro) ──
var authModo='login';
function cambiarAuthTab(modo){
  authModo=modo;
  document.getElementById('authTabLogin').classList.toggle('active',modo==='login');
  document.getElementById('authTabRegister').classList.toggle('active',modo==='register');
  document.getElementById('authSendBtn').textContent=modo==='login'?'Entrar →':'Crear mi cuenta →';
  document.getElementById('authError').classList.remove('show');
}
function mostrarAuthError(msg){
  var el=document.getElementById('authError');
  el.textContent=msg; el.classList.add('show');
}
function enviarAuth(){
  var email=document.getElementById('authEmail').value.trim();
  var pass=document.getElementById('authPassword').value;
  if(!email||!pass){ mostrarAuthError('Completa correo y contraseña'); return; }
  if(pass.length<6){ mostrarAuthError('La contraseña debe tener al menos 6 caracteres'); return; }
  document.getElementById('authError').classList.remove('show');
  if(authModo==='login'){ if(window._iniciarSesion) window._iniciarSesion(email,pass); }
  else { if(window._registrarse) window._registrarse(email,pass); }
}
function cerrarSesion(){ if(window._cerrarSesion) window._cerrarSesion(); }

render();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, setDoc, getDocs, deleteDoc, updateDoc, onSnapshot, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

var app=initializeApp({apiKey:"AIzaSyB7fkzZNNNY5oWt5oSAT-2wSwtJh69TKvs",authDomain:"e703-18361.firebaseapp.com",projectId:"e703-18361",storageBucket:"e703-18361.firebasestorage.app",messagingSenderId:"670782708176",appId:"1:670782708176:web:db6470aa8e73da59a201d5"});
var db=getFirestore(app);
var storage=getStorage(app);
var auth=getAuth(app);
var uid=null, miEmail=null;
var unsubs=[];
var revSubs={}; // unsubscribe de reacciones por revision (para "Mis envios")

function traducirErrorAuth(e){
  var c=e&&e.code||'';
  if(c==='auth/email-already-in-use') return 'Ese correo ya tiene una cuenta. Prueba iniciar sesión.';
  if(c==='auth/invalid-email') return 'Ese correo no parece válido.';
  if(c==='auth/weak-password') return 'La contraseña es muy débil (mínimo 6 caracteres).';
  if(c==='auth/user-not-found'||c==='auth/wrong-password'||c==='auth/invalid-credential') return 'Correo o contraseña incorrectos.';
  return 'Algo falló: '+(e&&e.message?e.message:'error desconocido');
}

window._registrarse=async function(email,pass){
  try{ await createUserWithEmailAndPassword(auth,email,pass); }
  catch(e){ window.mostrarAuthError(traducirErrorAuth(e)); }
};
window._iniciarSesion=async function(email,pass){
  try{ await signInWithEmailAndPassword(auth,email,pass); }
  catch(e){ window.mostrarAuthError(traducirErrorAuth(e)); }
};
window._cerrarSesion=async function(){ await signOut(auth); };

function limpiarSuscripciones(){
  unsubs.forEach(function(u){ u(); });
  unsubs=[];
  Object.keys(revSubs).forEach(function(k){ revSubs[k](); });
  revSubs={};
}

function calcularAmigosYSolicitudes(listaDe,listaPara){
  var amigosList=[], solicitudesList=[];
  listaDe.forEach(function(a){
    if(a.estado==='aceptada') amigosList.push({_id:a._id,uid:a.para,email:a.paraEmail});
    // si yo la envie y sigue pendiente, no aparece en "solicitudes" (esas son las que ME llegan)
  });
  listaPara.forEach(function(a){
    if(a.estado==='aceptada') amigosList.push({_id:a._id,uid:a.de,email:a.deEmail});
    else if(a.estado==='pendiente') solicitudesList.push({_id:a._id,de:a.de,deEmail:a.deEmail});
  });
  window.amigos=amigosList;
  window.solicitudes=solicitudesList;
  var dir=window.usuariosDirectorio||{};
  amigosList.forEach(function(a){ dir[a.uid]={email:a.email}; });
  window.usuariosDirectorio=dir;
  if(window.render) window.render();
}

function suscribirRevisionesMias(){
  var qMias=query(collection(db,'outfit_revisiones'),where('autorUid','==',uid));
  unsubs.push(onSnapshot(qMias,function(snap){
    var lista=[];
    snap.forEach(function(d){ lista.push(Object.assign({_id:d.id,_reacciones:{}},d.data())); });
    lista.sort(function(a,b){var fa=a.fechaCreacion&&a.fechaCreacion.seconds||0,fb=b.fechaCreacion&&b.fechaCreacion.seconds||0;return fb-fa;});
    // limpia listeners de reacciones que ya no aplican
    var idsActuales=lista.map(function(r){return r._id;});
    Object.keys(revSubs).forEach(function(id){ if(idsActuales.indexOf(id)===-1){ revSubs[id](); delete revSubs[id]; } });
    lista.forEach(function(r){
      if(revSubs[r._id]) return; // ya suscrito
      revSubs[r._id]=onSnapshot(collection(db,'outfit_revisiones',r._id,'reacciones'),function(snapR){
        var mapa={};
        snapR.forEach(function(dr){ mapa[dr.id]=dr.data(); });
        var actual=window.revisionesMias.find(function(x){return x._id===r._id;});
        if(actual){ actual._reacciones=mapa; if(window.render) window.render(); }
      });
    });
    window.revisionesMias=lista;
    if(window.render) window.render();
  }));
}

function suscribirRevisionesParaMi(){
  var qParaMi=query(collection(db,'outfit_revisiones'),where('destinatarios','array-contains',uid));
  unsubs.push(onSnapshot(qParaMi,function(snap){
    var lista=[];
    snap.forEach(function(d){ lista.push(Object.assign({_id:d.id,_miReaccion:null},d.data())); });
    lista.sort(function(a,b){var fa=a.fechaCreacion&&a.fechaCreacion.seconds||0,fb=b.fechaCreacion&&b.fechaCreacion.seconds||0;return fb-fa;});
    lista.forEach(function(r){
      var subKey='mireaccion_'+r._id;
      if(revSubs[subKey]) return;
      revSubs[subKey]=onSnapshot(doc(db,'outfit_revisiones',r._id,'reacciones',uid),function(dSnap){
        var actual=window.revisionesParaMi.find(function(x){return x._id===r._id;});
        if(actual){ actual._miReaccion=dSnap.exists()?dSnap.data():null; if(window.render) window.render(); }
      });
    });
    window.revisionesParaMi=lista;
    if(window.render) window.render();
  }));
}

function iniciarSuscripciones(){
  var qPrendas=query(collection(db,'armario_prendas'),where('uid','==',uid));
  unsubs.push(onSnapshot(qPrendas,function(snap){
    var lista=[]; snap.forEach(function(d){lista.push(Object.assign({_id:d.id},d.data()));});
    lista.sort(function(a,b){return (a.nombre||'').localeCompare(b.nombre||'');});
    window.prendas=lista; if(window.render) window.render();
  }));
  var qReferencias=query(collection(db,'armario_referencias'),where('uid','==',uid));
  unsubs.push(onSnapshot(qReferencias,function(snap){
    var lista=[]; snap.forEach(function(d){lista.push(Object.assign({_id:d.id},d.data()));});
    lista.sort(function(a,b){var fa=a.fechaCreacion&&a.fechaCreacion.seconds||0,fb=b.fechaCreacion&&b.fechaCreacion.seconds||0;return fb-fa;});
    window.referencias=lista; if(window.render) window.render();
  }));
  var qOutfits=query(collection(db,'armario_outfits'),where('uid','==',uid));
  unsubs.push(onSnapshot(qOutfits,function(snap){
    var lista=[]; snap.forEach(function(d){lista.push(Object.assign({_id:d.id},d.data()));});
    lista.sort(function(a,b){var fa=a.fechaCreacion&&a.fechaCreacion.seconds||0,fb=b.fechaCreacion&&b.fechaCreacion.seconds||0;return fb-fa;});
    window.outfitsGuardados=lista; if(window.render) window.render();
  }));

  var listaDe=[], listaPara=[], recibidoDe=false, recibidoPara=false;
  var qAmistadDe=query(collection(db,'amistades'),where('de','==',uid));
  unsubs.push(onSnapshot(qAmistadDe,function(snap){
    listaDe=[]; snap.forEach(function(d){listaDe.push(Object.assign({_id:d.id},d.data()));});
    recibidoDe=true;
    if(recibidoPara) calcularAmigosYSolicitudes(listaDe,listaPara);
  }));
  var qAmistadPara=query(collection(db,'amistades'),where('para','==',uid));
  unsubs.push(onSnapshot(qAmistadPara,function(snap){
    listaPara=[]; snap.forEach(function(d){listaPara.push(Object.assign({_id:d.id},d.data()));});
    recibidoPara=true;
    if(recibidoDe) calcularAmigosYSolicitudes(listaDe,listaPara);
  }));

  var qGrupos=query(collection(db,'grupos'),where('miembros','array-contains',uid));
  unsubs.push(onSnapshot(qGrupos,function(snap){
    var lista=[]; snap.forEach(function(d){lista.push(Object.assign({_id:d.id},d.data()));});
    window.grupos=lista; if(window.render) window.render();
  }));

  suscribirRevisionesMias();
  suscribirRevisionesParaMi();
}

onAuthStateChanged(auth,async function(user){
  if(user){
    uid=user.uid; miEmail=user.email;
    await setDoc(doc(db,'usuarios',uid),{email:miEmail,fechaCreacion:serverTimestamp()},{merge:true}).catch(function(){});
    document.getElementById('authWrap').style.display='none';
    document.getElementById('appScreen').style.display='block';
    window.prendas=[]; window.referencias=[]; window.outfitsGuardados=[];
    window.amigos=[]; window.solicitudes=[]; window.grupos=[];
    window.revisionesMias=[]; window.revisionesParaMi=[]; window.usuariosDirectorio={};
    iniciarSuscripciones();
  } else {
    uid=null; miEmail=null;
    limpiarSuscripciones();
    window.prendas=[]; window.referencias=[]; window.outfitsGuardados=[];
    window.amigos=[]; window.solicitudes=[]; window.grupos=[];
    window.revisionesMias=[]; window.revisionesParaMi=[]; window.usuariosDirectorio={};
    document.getElementById('appScreen').style.display='none';
    document.getElementById('authWrap').style.display='flex';
    document.getElementById('authEmail').value='';
    document.getElementById('authPassword').value='';
  }
});

window._subirPrenda=async function(archivo,nombre,categoria){
  if(!uid) return;
  try{
    var path='armario/'+uid+'/prendas/'+Date.now()+'_'+archivo.name;
    var sref=ref(storage,path);
    await uploadBytes(sref,archivo);
    var url=await getDownloadURL(sref);
    await addDoc(collection(db,'armario_prendas'),{uid:uid,nombre:nombre,categoria:categoria,imagenUrl:url,storagePath:path,fechaCreacion:serverTimestamp()});
  }catch(e){ alert('Error subiendo la prenda: '+e.message); }
};
window._eliminarPrenda=async function(id){
  try{
    var p=window.prendas.find(function(x){return x._id===id;});
    await deleteDoc(doc(db,'armario_prendas',id));
    if(p&&p.storagePath){ deleteObject(ref(storage,p.storagePath)).catch(function(){}); }
  }catch(e){ alert('Error eliminando: '+e.message); }
};

window._subirReferencia=async function(archivo,nota){
  if(!uid) return;
  try{
    var path='armario/'+uid+'/referencias/'+Date.now()+'_'+archivo.name;
    var sref=ref(storage,path);
    await uploadBytes(sref,archivo);
    var url=await getDownloadURL(sref);
    await addDoc(collection(db,'armario_referencias'),{uid:uid,imagenUrl:url,storagePath:path,nota:nota||'',fechaCreacion:serverTimestamp()});
  }catch(e){ alert('Error subiendo la referencia: '+e.message); }
};
window._eliminarReferencia=async function(id){
  try{
    var r=window.referencias.find(function(x){return x._id===id;});
    await deleteDoc(doc(db,'armario_referencias',id));
    if(r&&r.storagePath){ deleteObject(ref(storage,r.storagePath)).catch(function(){}); }
  }catch(e){ alert('Error eliminando: '+e.message); }
};

window._guardarOutfit=async function(outfit){
  if(!uid) return;
  try{ await addDoc(collection(db,'armario_outfits'),Object.assign({},outfit,{uid:uid,fechaCreacion:serverTimestamp()})); }
  catch(e){ alert('Error guardando el outfit: '+e.message); }
};
window._eliminarOutfit=async function(id){
  try{ await deleteDoc(doc(db,'armario_outfits',id)); }
  catch(e){ alert('Error eliminando: '+e.message); }
};

// ── Amistades ──
window._enviarSolicitud=async function(email){
  try{
    if(email===miEmail){ alert('Ese es tu propio correo 🌸'); return; }
    var qU=query(collection(db,'usuarios'),where('email','==',email));
    var snap=await getDocs(qU);
    if(snap.empty){ alert('Esa persona todavía no tiene cuenta en Mi Armario. Invítala a registrarse primero 💌'); return; }
    var otroUid=snap.docs[0].id;
    var yaExiste=window.amigos.some(function(a){return a.uid===otroUid;}) || window.solicitudes.some(function(s){return s.de===otroUid;});
    if(yaExiste){ alert('Ya son amigas, o ya tienes una solicitud de esa persona pendiente.'); return; }
    await addDoc(collection(db,'amistades'),{de:uid,deEmail:miEmail,para:otroUid,paraEmail:email,estado:'pendiente',fechaCreacion:serverTimestamp()});
    alert('💌 ¡Solicitud enviada!');
  }catch(e){ alert('Error enviando la solicitud: '+e.message); }
};
window._responderSolicitud=async function(id,aceptar){
  try{
    if(aceptar) await updateDoc(doc(db,'amistades',id),{estado:'aceptada'});
    else await deleteDoc(doc(db,'amistades',id));
  }catch(e){ alert('Error: '+e.message); }
};
window._quitarAmiga=async function(id){
  try{ await deleteDoc(doc(db,'amistades',id)); }
  catch(e){ alert('Error: '+e.message); }
};

// ── Grupos ──
window._crearGrupo=async function(nombre,miembros){
  try{
    await addDoc(collection(db,'grupos'),{nombre:nombre,creadorUid:uid,miembros:miembros.concat([uid]),fechaCreacion:serverTimestamp()});
  }catch(e){ alert('Error creando el grupo: '+e.message); }
};

// ── Revisiones de outfit ──
window._enviarRevision=async function(nombre,prendasOutfit,destinatarios,etiqueta){
  try{
    await addDoc(collection(db,'outfit_revisiones'),{
      autorUid:uid,autorEmail:miEmail,nombre:nombre,prendas:prendasOutfit,
      destinatarios:destinatarios,etiqueta:etiqueta,fechaCreacion:serverTimestamp()
    });
  }catch(e){ alert('Error mandando el outfit: '+e.message); }
};
window._reaccionar=async function(revId,tipo,comentario){
  try{
    await setDoc(doc(db,'outfit_revisiones',revId,'reacciones',uid),{
      tipo:tipo,comentario:comentario||'',autorEmail:miEmail,fecha:serverTimestamp()
    },{merge:true});
  }catch(e){ alert('Error guardando tu opinión: '+e.message); }
};
</script>
